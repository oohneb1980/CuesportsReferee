<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a referee's match card — scoreboard-style header, one question card at a time, baize green with Cuesports red for errors */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#17201b; --muted:#5d6b63; --line:#d8dfd9;
  --baize:#1d5c3f; --baize-soft:#e3efe7; --red:#c8321b; --red-soft:#fbe7e3; --gold:#a8790f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --ink:#e7eee9; --muted:#9aaba1; --line:#2b3831;
  --baize:#5fbf8c; --baize-soft:#1b3326; --red:#ff7a62; --red-soft:#3a1d18; --gold:#e0b44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --ink:#e7eee9; --muted:#9aaba1; --line:#2b3831;
  --baize:#5fbf8c; --baize-soft:#1b3326; --red:#ff7a62; --red-soft:#3a1d18; --gold:#e0b44a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.2rem,6vw,3.2rem);text-transform:uppercase}
h2{font-size:1.6rem;text-transform:uppercase}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.lede{color:var(--muted);max-width:60ch;margin:6px 0 0}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Set picker */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:left;color:var(--ink);
  display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.set:hover{border-color:var(--baize);transform:translateY(-2px)}
.set .name{font-family:var(--display);font-weight:800;font-size:1.9rem;text-transform:uppercase;line-height:1}
.set .meta{font-size:.85rem;color:var(--muted)}
.set .std{font-family:var(--mono);font-size:.72rem;color:var(--baize)}
.set .best{font-size:.8rem;color:var(--gold);font-weight:600;min-height:1.2em}

/* Setup panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mode{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:1rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--baize);background:var(--baize-soft)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600}
select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--baize);color:var(--surface);border:0;border-radius:8px;padding:12px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);padding:0;text-decoration:underline;font-size:.9rem}

/* Scoreboard */
.board{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;background:var(--ink);color:var(--bg);flex-wrap:wrap}
.board > div{padding:10px 16px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.board > div:last-child{border-right:0}
.board .k{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.board .v{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.board .grow{flex:1;min-width:140px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--baize);width:0;transition:width .3s}

/* Question */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.chip{font-family:var(--mono);font-size:.72rem;background:var(--baize-soft);color:var(--baize);padding:3px 8px;border-radius:4px}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.45;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--baize)}
.opt .letter{font-family:var(--display);font-weight:800;font-size:1.15rem;width:1.4em;flex:none;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--baize);background:var(--baize-soft)}
.opt.correct .letter{color:var(--baize)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{color:var(--red)}
.opt.dim{opacity:.55}
.verdict{border-left:4px solid var(--baize);background:var(--baize-soft);padding:12px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
.verdict.no{border-color:var(--red);background:var(--red-soft)}
.verdict strong{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
.verdict.ok strong{color:var(--baize)} .verdict.no strong{color:var(--red)}
.verdict p{margin:0}
.verdict .ans{font-weight:600}

/* Results */
.big{font-family:var(--display);font-weight:800;font-size:clamp(4rem,16vw,6.5rem);line-height:.9;font-variant-numeric:tabular-nums}
.pass{color:var(--baize)} .fail{color:var(--red)}
.topics{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:.88rem}
.trow .bar{height:8px}
.trow .bar i.lo{background:var(--red)}
.trow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.rv .yours{color:var(--red)} .rv .right{color:var(--baize);font-weight:600}
.rv .why{color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.trow{grid-template-columns:minmax(0,1fr) 70px 46px}.board .v{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

window.BANK_POOL = [
// ---- General rules
["General Rules","§1.1","A player protests a call, saying he did not know the rule. What should the referee do?","Keep the call; not knowing a rule is never grounds to reverse it",["Reverse the call since the player was unaware","Replay the shot","Refer it to the tournament director and replay"],"Under §1.1 the player is responsible for knowing all rules, regulations and schedules. Officials make reasonable efforts to publish them, but ultimate responsibility rests with the player."],
["General Rules","§1.1","Who carries the ultimate responsibility for knowing the rules and schedules of a competition?","The player",["The referee","The tournament director","The organising association"],"§1.1: officials make reasonable efforts to have the information available, but the ultimate responsibility rests with the player."],
["The Lag","§1.2","What does the lag decide?","Order of play; the winner chooses who breaks first",["Which ball group each player takes","Who racks for the whole match","Which table the match is played on"],"§1.2: the lag decides order of play, and the winner of the lag chooses who breaks first."],
["The Lag","§1.2","In a lag, which ball wins?","The ball that stops closer to the head cushion",["The ball that stops closer to the foot cushion","The ball that travels furthest","The ball that stops closer to the Foot Spot"],"§1.2: each player shoots from above the Head String to the foot cushion and back. The ball stopping closer to the head cushion wins."],
["The Lag","§1.2","From where do players shoot their lag balls?","From above the Head String",["From behind the Foot String","From anywhere on the table","From the Head Spot only"],"§1.2: each player shoots a ball from above the Head String to the foot cushion and back, at about the same time."],
["The Lag","§1.2","Which of these makes a lag bad?","The ball touches a side cushion",["The ball touches the head cushion on the way back","The ball stops near the head cushion","The ball is struck at the same time as the other"],"§1.2(d): a lag is bad if the ball touches a side cushion. Others: crosses the Long String, contacts the foot cushion other than once, is pocketed or off the table, or rests in the corner pocket past the head-cushion nose."],
["The Lag","§1.2","A lag ball contacts the foot cushion twice. What is the ruling?","The lag is bad",["The lag is good if it stops near the head cushion","The players lag again automatically","The opponent wins the lag only if his ball is good"],"§1.2(b): a lag is bad if the ball contacts the foot cushion other than once. If only one lag is bad, the other player wins; if both are bad, they lag again."],
["The Lag","§1.2","A lag ball crosses the Long String. What happens?","The lag is bad",["Nothing; crossing the Long String is allowed","The player re-lags alone","The lag is good if it stays on the table"],"§1.2(a): a lag is bad if the ball crosses the Long String (the centre line running the length of the table)."],
["The Lag","§1.2","Both players' lags are bad. What happens?","The players lag again",["The player whose ball stopped closer still wins","The referee tosses a coin","The player who lagged first breaks"],"§1.2(h): players lag again if both lags are bad."],
["The Lag","§1.2","One player strikes his lag ball after the other ball has already touched the foot cushion. What happens?","The players lag again",["That player loses the lag","The lag stands","That player's lag is good"],"§1.2(f): players lag again if a ball is struck after the other has touched the foot cushion."],
["The Lag","§1.2","The referee cannot determine which lag ball stopped closer to the head cushion. What happens?","The players lag again",["The first shooter wins","The referee picks a winner","The player on the right wins"],"§1.2(g): players lag again if the referee cannot determine which ball stopped closer."],
["The Lag","§1.2","A lag ball comes to rest in the corner pocket, past the nose of the head cushion. Is the lag good?","No, the lag is bad",["Yes, it is the closest possible lag","Yes, if the ball does not drop","Only if the other lag is also in a pocket"],"§1.2(e): a lag is bad if the ball rests in the corner pocket past the head-cushion nose."],
["Equipment","§1.4","How many mechanical bridges may a player use at one time?","Up to two",["Only one","Up to three","Unlimited"],"§1.4: up to two mechanical bridges may be used. If two are used, the second must be supported by the head of the first."],
["Equipment","§1.4","When using a mechanical bridge, where must the cue rest?","On the bridge head",["On the bridge shaft","On the player's hand","On the rail"],"§1.4: the cue MUST rest on the bridge head."],
["Equipment","§1.4","A player uses two mechanical bridges. How must the second one be placed?","Supported by the head of the first bridge",["Laid flat on the cloth beside the first","Held by the opponent","Rested on the rail"],"§1.4: if two bridges are used, the second bridge must be supported by the head of the first bridge."],
["Equipment","§1.4","A player places a piece of chalk on the rail to aim at. What does the rule say?","Chalk may never be used as an aiming marker",["It is allowed if removed before the shot","It is allowed on the rail but not on the cloth","It is allowed with the referee's permission"],"§1.4: chalk is never to be used as an aiming marker."],
["Equipment","§1.4","May a player switch between break, jump and normal cues during a match?","Yes, and extenders are allowed",["No, one cue only per rack","Only between racks","Only with the opponent's consent"],"§1.4: players may switch between break, jump and normal cues; extenders are allowed."],
["Equipment","§1.4","Who decides what is a reasonable amount of hand powder?","The referee",["The player","The opponent","The tournament director only"],"§1.4: gloves may be used and powder in a reasonable amount; the referee decides what is reasonable."],
["Spotting Balls","§1.5","Where is a ball normally spotted?","On the Long String as close as possible to the Foot Spot, between the Foot Spot and the foot rail",["On the Head Spot","On the Centre Spot","Anywhere the incoming player chooses"],"§1.5: balls are spotted along the Long String as close as possible to the Foot Spot, between the Foot Spot and the foot rail, without moving any interfering ball."],
["Spotting Balls","§1.5","An object ball must be spotted but the Foot Spot is occupied by another object ball. Where does it go?","On the Long String below the Foot Spot, in contact with the interfering ball",["On the Head Spot","Next to the interfering ball, with a small gap","On the Centre Spot"],"§1.5: if the spot is blocked, the ball is placed in contact with the interfering ball (both balls touching)."],

["Spotting Balls","§1.5","The whole Long String below the Foot Spot is blocked. Where is the ball spotted?","Above the Foot Spot, as close to it as possible",["On the Head Spot","In the kitchen","It is not spotted"],"§1.5: if the Long String below is blocked, the ball is spotted above the Foot Spot, as close to it as possible."],
["Spotting Balls","§1.5","When spotting a ball, may the referee move an interfering ball to make room?","No, spot without moving any interfering ball",["Yes, if it is an object ball","Yes, if both players agree","Yes, interfering balls go to the Head Spot"],"§1.5: the ball is placed without moving any interfering ball."],
["Cue-Ball in Hand","§1.6","With cue-ball in hand, may the player move the cue-ball using the cue tip?","Yes, but not with a forward stroke motion",["No, only by hand","Yes, with any motion","Only with the ferrule"],"§1.6: any part of the cue-stick may move it, including the tip, but not with a forward stroke motion (that would begin a shot)."],
["Cue-Ball in Hand","§1.6","With ball in hand anywhere on the table, until when may the cue-ball keep being repositioned?","Until the shot begins",["Until the player chalks","Until the referee says so","Until the player first touches it with the cue"],"§1.6: the cue-ball may be placed anywhere on the playing surface and may keep moving until the shot begins."],
["Cue-Ball in Hand","§1.6","Ball in hand above the Head String, and all legal object balls are also above the Head String. What may the shooter request?","The nearest legal object ball to be spotted",["All balls above the string to be spotted","A re-rack","Ball in hand anywhere"],"§1.6: if all legal balls are above the string too, the nearest legal object ball may be spotted on request."],
["Cue-Ball in Hand","§1.6","Ball in hand above the Head String; two legal object balls are equally near and both above the string. What happens on request to spot?","The shooter may designate which ball is spotted",["Both are spotted","The referee chooses","The lower-numbered is spotted"],"§1.6: if 2 or more balls are an equal distance, the shooter may designate which ball is to be spotted."],
["Cue-Ball in Hand","§1.6","Ball in hand above the Head String. An object ball rests exactly on the Head String. Is it playable?","Yes, a ball on the Head String is considered playable",["No, it is in the kitchen","Only if it is the lowest ball","Only after a push out"],"§1.6: an object ball resting on the Head String is considered playable."],
["Call Shot","§1.7","In a called-shot game, what must be indicated?","The intended ball and pocket, if not obvious",["Ball, pocket, cushions and kisses","Only the ball","Only the pocket"],"§1.7: intended ball and pocket are indicated if not obvious. Details such as cushions, cannons and other balls are irrelevant."],
["Call Shot","§1.7","How many balls may be called on one shot?","Only one",["Two","As many as the shooter wants","Two if one is the money ball"],"§1.7: only 1 ball can be called per shot."],
["Call Shot","§1.7","A player calls a ball and pocket. Must he also say which cushion the ball will hit?","No, cushions and kisses are irrelevant",["Yes, on every bank shot","Yes, if asked by the opponent","Only for the money ball"],"§1.7: details such as cushions, cannons and other balls are irrelevant; only ball and pocket matter."],
["Call Shot","§1.7","On a combination shot that is not obvious, who may ask what the call is?","The referee or the opponent",["Only the referee","Only the opponent","Nobody; the shooter need not say"],"§1.7: the referee or opponent may ask for the call on bank, combination and similar shots."],
["Call Shot","§1.7","Instead of calling a ball and pocket, what else may a shooter call (where allowed)?","Safety, so play passes to the opponent at the end of the shot",["Push out","Re-rack","Time out"],"§1.7: the shooter may call safety instead; play passes to the opponent at the end of the shot."],
["Settling & Interference","§1.8","A ball settles slightly on its own while nobody is shooting. What does the referee do?","Leave it as is; slight settling is a normal hazard",["Restore it to its previous spot","Re-rack","Call a foul on the shooter"],"§1.8: slight settling is a normal hazard; leave the ball as is."],
["Settling & Interference","§1.8","A ball sitting on the pocket edge settles and drops in just before a shot. What happens?","The ball is restored and the shot replayed",["The ball counts as pocketed","Foul on the shooter","The ball is spotted on the Foot Spot"],"§1.8: if a settling ball drops into a pocket during or just prior to a shot, restore the ball and the shot is replayed."],
["Settling & Interference","§1.9","Who restores disturbed balls, and must the players accept it?","The referee restores them, and players must accept the judgment",["The shooter restores them","The opponent restores them","Both players must agree on each ball"],"§1.9: the referee restores disturbed balls to the best of his ability, and players must accept the judgment."],
["Settling & Interference","§1.10","Outside interference changes the shot and its outcome. What happens?","Restore the balls and replay the shot",["Accept the result","Foul on the shooter","Declare a stalemate immediately"],"§1.10: if interference affects the shot and outcome, the balls are restored and the shot replayed."],
["Settling & Interference","§1.10","Outside interference disturbs a ball but has no effect on the shot. What happens?","Restore only the disturbed balls and play continues",["Replay the shot","Re-rack","Foul on the shooter"],"§1.10: with no effect on the shot, only the disturbed balls are restored and play continues."],
["Settling & Interference","§1.10","Balls disturbed by interference cannot be restored. How is it handled?","As a stalemate",["As a foul on the shooter","As a loss of rack for the shooter","Play continues as the balls lie"],"§1.10: if the balls cannot be restored, handle it as a stalemate."],
["Protests & Stalemate","§1.11","A player asks the referee to reconsider a judgment call. What is the status of the referee's judgment?","The referee's judgment call is final",["It can be appealed to the opponent","It is reviewed on video","It must be confirmed by the tournament director"],"§1.11: a player may ask you to reconsider, but your judgment call is final. Claims of wrong rule application go to the appeals authority."],
["Protests & Stalemate","§1.11","A player claims the referee applied the wrong rule. What happens?","It goes to the appeals authority and play is suspended meanwhile",["The referee's decision stands with no appeal","Play continues while it is reviewed","The rack is replayed"],"§1.11: claims of wrong rule application go to the appeals authority; play is suspended meanwhile."],
["Protests & Stalemate","§1.12","During the decisive rack, while the opponent is at the table, a player unscrews his jointed playing cue. What is it?","A concession; he loses the match",["Unsportsmanlike conduct warning","No issue; he may be changing cues","A standard foul"],"§1.12: a concession loses the match, e.g. unscrewing the jointed playing cue while the opponent is at the table during the decisive rack."],
["Protests & Stalemate","§1.13","The referee sees no progress towards a conclusion of the rack. What is the procedure?","Announce it; after 3 more turns each with no progress, declare a stalemate",["Declare a stalemate immediately","Give each player 1 more turn","Award the rack to the player ahead"],"§1.13: announce to the players that 3 more turns each will be allowed. If still no progress, declare a stalemate."],

["Definitions","§2.2","A ball hangs over the pocket edge, supported by another ball. When is it considered pocketed?","If removing the supporting ball would cause it to drop",["Never","Always","Only after 5 seconds"],"§2.2: a ball supported by another ball at the pocket edge is considered pocketed if removing the supporting ball would cause it to drop."],

["Definitions","§2.6","An object ball flies off the table, hits a light fitting and lands back on the playing surface. What is it?","Driven off the table",["Still in play; no foul","Pocketed","A re-shot"],"§2.6: a ball is also considered off the table if it would have left the table but hits an object (e.g. lighting, chalk) and returns."],
["Definitions","§2.6","A ball jumps onto the top of the rail, rolls along it and drops back onto the playing surface. Is it off the table?","No, touching the rail top and returning is not off the table",["Yes","Only if it touched the wood","Yes if it rolled more than a diamond"],"§2.6: a ball contacting the top of the rail and returning to the table is not off the table."],
["Definitions","§2.6","An object ball jumps onto a rail, rolls along it and drops into a pocket after a legal hit. Ruling?","No foul; the ball is pocketed",["Foul; ball off the table","The ball is spotted","Replay the shot"],"§2.6: a ball on the rail top that returns to the table, or into a pocket, is not off the table. It counts as pocketed."],
["Definitions","§2.7","A ball is frozen to a rail before the shot. What must happen for it to count as driven to that rail?","It must leave the rail and return to it",["Nothing; it already counts","It must move along the rail","It must be pocketed"],"§2.7: a frozen ball must leave and return to count as driven to a rail."],
["Definitions","§2.7","When is an object ball treated as frozen to a rail?","Only when it is declared frozen",["Whenever it looks close","Whenever the shooter says so after the shot","Always, if it is within a ball width"],"§2.7 note: an object ball is not frozen unless declared."],
["Definitions","§2.7","Which of these also counts as a ball 'driven to a rail'?","A ball that is pocketed or driven off the table",["A ball that moves towards a rail but stops short","A ball that spins in place","A ball touched by the cue"],"§2.7: being pocketed or driven off the table also counts as driven to a rail."],
["Definitions","§2.11","A player unintentionally miscues. What is the ruling?","It is a legal shot",["Foul","Replay","Unsportsmanlike conduct"],"§2.11: an unintentional miscue is considered a legal shot (an intentional miscue is unsportsmanlike conduct, §3.16)."],
["Definitions","§2.11","What is a scoop shot?","The cue tip contacts the playing surface and cue-ball at the same time; it is treated as a miscue",["A legal jump shot","A push shot","A double hit"],"§2.11: a scoop shot is when the tip contacts the playing surface and the cue-ball at the same time; it is considered a miscue."],
["Definitions","§2.11","During a miscue, is contact with the side of the cue-stick assumed?","No, unless contact is clearly visible",["Yes, always","Yes, if there was a sharp sound","Only on jump shots"],"§2.11: contact with the side of the cue-stick is assumed not to have occurred unless clearly visible."],
["Definitions","§2.13","How is the position of a ball determined?","By projecting its centre vertically downwards",["By its nearest edge","By where the player says","By its shadow"],"§2.13: position of a ball is determined by projection of its centre vertically downwards."],
["Definitions","§2.16","In which discipline is the 'safety' declaration applicable?","8-Ball",["9-Ball","10-Ball","All three"],"§2.16: the safety shot declaration is applicable only for the 8-Ball discipline."],
["Definitions","§2.19","When does a shot begin?","When the tip contacts the cue-ball with a forward stroke motion",["When the player gets down on the shot","When the player addresses the cue-ball","When the cue-ball is placed"],"§2.19: a shot begins when the tip contacts the cue-ball with a forward stroke motion."],
["Definitions","§2.19","When does a shot end?","When all balls in play stop moving and spinning",["When the cue-ball stops","When the object ball drops","When the player stands up"],"§2.19: a shot ends when all balls in play stop moving and spinning."],
// ---- Fouls
["Fouls","§3","When should the referee call a foul?","Immediately when it occurs",["At the end of the shot","Before the next shot","Only when the opponent claims it"],"§3: immediately call a foul when it has occurred; do not wait till a shot begins or ends."],
["Fouls","§3","A foul happened but was not called before the next shot began. Status?","It is condoned and assumed not to have happened",["It is still penalised","The previous shot is replayed","It is penalised with a warning"],"§3: a foul not called before the next shot begins is assumed not to have happened."],
["Fouls","§3","A player's clothing accidentally touched a ball during his shot. Nobody called it. After another shot, the opponent protests. Ruling?","The foul is condoned",["Foul; ball in hand to opponent","Replay both shots","Unsportsmanlike conduct"],"§3: a foul not called before the next shot begins is assumed not to have happened."],
["Fouls","§3.1","The cue-ball is pocketed. What is it?","A foul",["Legal if an object ball was pocketed too","Legal in 8-Ball only","A re-shot"],"§3.1: cue-ball pocketed or driven off the table is a foul."],
["Fouls","§3.1","The cue-ball jumps off, bounces off a player and lands back on the table. Ruling?","Foul; cue-ball off the table",["No foul","Replay","Foul only if it hit the floor"],"§3.1 with §2.6: bouncing off a light, chalk or a player and returning counts as off the table."],
["Fouls","§3.2","In 9-Ball, the cue-ball first hits the 5 while the 2 is the lowest ball on the table. Ruling?","Foul: wrong ball first",["Legal if a ball is pocketed","Legal in 9-Ball","Only a foul if the 9 drops"],"§3.2: in 9-Ball and 10-Ball the first ball contacted must be the lowest-numbered ball on the table."],
["Fouls","§3.2","The legal and an illegal ball are struck at about the same instant and the referee cannot tell which was first. Ruling?","Assume the legal ball was struck first",["Foul","Replay the shot","Ask the opponent"],"§3.2: if too close to tell, assume the legal ball was first; benefit of doubt to the shooter."],
["Fouls","§3.3","No ball is pocketed. What must happen after the cue-ball contacts an object ball?","At least one ball (cue-ball or any object ball) must be driven to a rail",["The object ball must reach a rail","The cue-ball must reach a rail","Two balls must reach a rail"],"§3.3: if no ball is pocketed, after contact at least one ball, cue-ball or any object ball, must be driven to a rail."],
["Fouls","§3.3","The ball and the cushion are struck at about the same instant. How does the referee decide?","Assume the ball was struck first",["Assume the cushion was struck first","Call a foul","Replay"],"§3.3: if too close to tell, assume the ball was struck first."],
["Fouls","§3.3","The cue-ball touches a rail before hitting the object ball, then no ball reaches a rail and nothing is pocketed. Ruling?","Foul: no rail after contact",["Legal, the cue-ball touched a rail","Legal if the object ball moved","Replay"],"§3.3: the rail must be reached after contact with the object ball. A rail before contact does not count."],
["Fouls","§3.4","When must at least one foot touch the floor?","At the instant the tip contacts the cue-ball",["During the whole stance","Only on the break","At the end of the follow-through"],"§3.4: at least one foot must touch the floor at the instant the tip contacts the cue-ball."],
["Fouls","§3.5","Is driving an object ball off the table a foul?","Yes",["No, only the cue-ball","Only on the break","Only in 8-Ball"],"§3.5: driving an object ball off the table is a foul. Whether it is spotted depends on the discipline."],
["Fouls","§3.5","In 8-Ball, which off-the-table ball is spotted on the break?","Only the 8-ball",["All balls","Any striped ball","None"],"§3.5: in 8-Ball only the 8-ball is spotted when off the table on the break."],
["Fouls","§3.6","A player accidentally brushes an object ball with his sleeve. What is it?","A standard foul",["Unsportsmanlike conduct","No foul if it moved less than an inch","A loss of rack"],"§3.6: touching any object ball is a foul. Accidental is a standard foul; intentional is §3.16 Unsportsmanlike Conduct."],
["Fouls","§3.6","A player's dropped chalk moves an object ball. Who is responsible?","The shooter, for equipment he controls",["Nobody; it is accidental","The referee","The opponent"],"§3.6: the shooter is responsible for equipment he controls at the table: chalk, bridges, clothing, hair, any part of the body."],
["Fouls","§3.6","A player intentionally moves an object ball with his hand. How is it treated?","As Unsportsmanlike Conduct (§3.16)",["As a standard foul only","As no foul","As a replay"],"§3.6: intent decides. Intentional touching is handled under §3.16 Unsportsmanlike Conduct."],
["Fouls","§3.7","The cue tip is still on the cue-ball when it reaches a very close object ball. Ruling?","Foul: double hit",["Legal","Legal if the ball is pocketed","Replay"],"§3.7: tip contacting the cue-ball twice, or still on it when it reaches a close object ball, is a foul."],
["Fouls","§3.7","The cue-ball barely grazes a very close object ball. How is it treated?","Assumed legal",["Foul","Push shot","Double hit"],"§3.7: a bare graze on a very close ball is assumed legal."],
["Fouls","§3.7","The cue-ball is frozen to a legal object ball. The player shoots towards it. Ruling?","Legal",["Foul: double hit","Foul: push","Only legal if the object ball reaches a rail"],"§3.7: with the cue-ball frozen to a legal object ball, shooting towards or partly into it is legal."],
["Fouls","§3.7","Who may declare that balls are frozen?","The referee or the opponent",["Only the shooter","Only the referee","Nobody; it is automatic"],"§3.7: balls are frozen only if declared, and the declaration is made by the referee or the opponent."],
["Fouls","§3.7","In 9-Ball, the shooter plays away from a ball frozen to the cue-ball. Has he hit that ball?","No, playing away is not considered as hitting it",["Yes","Only if it moved","Yes, if declared frozen"],"§3.7: in 8-Ball, 9-Ball and 10-Ball, playing away from a frozen ball is NOT considered as having hit the ball."],
["Fouls","§3.7","When the cue-ball is frozen to a ball, what counts as contact with that ball?","Moving it",["Any shot near it","Shooting away from it","Nothing; frozen balls never count"],"§3.7: moving the frozen ball counts as contact."],
["Fouls","§3.8","What is a push shot?","Prolonging tip-to-cue-ball contact beyond that seen in normal shots",["Any soft shot","A shot with the cue elevated","A shot that hits a frozen ball"],"§3.8: a push shot is prolonging tip-to-cue-ball contact beyond that seen in normal shots. It is a foul."],
["Fouls","§3.9","A player shoots while a ball is still spinning in place. Ruling?","Foul: balls still moving",["Legal, the ball is not rolling","Legal if it is not the cue-ball","Replay"],"§3.9: beginning a shot while any ball in play is moving or spinning is a foul."],
["Fouls","§3.10","With ball in hand above the Head String, the player places the cue-ball on the Head String line and shoots. Ruling?","Foul: bad cue-ball placement",["Legal, the line is part of the area","Legal if the ball crosses the line","Warning only"],"§3.10: when in hand above the Head String, playing from on or below the string is a foul."],
["Fouls","§3.10","A player with ball in hand above the Head String is unsure whether it is placed correctly. What may he do?","Ask the referee about the placement",["Nothing; he must take the risk","Ask the opponent","Shoot and appeal later"],"§3.10: if a player is unsure, he may ask the referee about the placement."],
["Fouls","§3.11","With ball in hand above the Head String, what must the cue-ball do?","Cross the Head String or contact a ball in front of or on it",["Hit a rail first","Hit the lowest ball","Stay above the string"],"§3.11: the cue-ball must either cross the Head String or contact a ball in front of or on it; otherwise it is a foul."],
["Fouls","§3.11","A player intentionally fails to cross the Head String from ball in hand above it. How is it treated?","As Unsportsmanlike Conduct",["As a standard foul only","As legal","As a replay"],"§3.11: if intentional it is considered §3.16 Unsportsmanlike Conduct."],
["Fouls","§3.12","A player plays out of turn unintentionally. Ruling?","Standard foul; balls normally played from the position left",["Loss of rack","Replay with no foul","Unsportsmanlike conduct"],"§3.12: unintentional play out of turn is a standard foul. Balls are normally played from the position left."],
["Fouls","§3.12","A player intentionally plays out of turn. Ruling?","Unsportsmanlike Conduct",["Standard foul","No foul","Loss of match automatically"],"§3.12: intentional play out of turn falls under §3.16 Unsportsmanlike Conduct."],
["Fouls","§3.13","In 9-Ball, a player commits three consecutive fouls with no legal shot between. Ruling?","Loss of rack",["Ball in hand to opponent only","Loss of match","Warning"],"§3.13: in 9-Ball and 10-Ball, three consecutive fouls with no intervening legal shot is loss of rack."],
["Fouls","§3.13","A player is on two fouls but the referee forgot to warn him. He fouls again. Ruling?","It counts only as his second foul",["Loss of rack","It counts as his third foul","Foul ignored"],"§3.13: warn a shooter on two fouls when he comes to the table. Otherwise a third foul counts only as the second."],
["Fouls","§3.13","When must the three-foul warning be given?","When the player on two fouls comes to the table",["Immediately after the second foul","After the third foul","Only if the opponent asks"],"§3.13: warn a shooter on two fouls when he comes to the table."],
["Fouls","§3.14","A player plays too slowly and does not speed up when advised. What does the referee do?","Impose a shot clock on both players",["Impose a shot clock on that player only","Award a foul immediately","Forfeit the rack"],"§3.14: advise the player to speed up. If he doesn't, impose a shot clock on both players. Exceeding the limit is a standard foul."],
["Fouls","§3.14","A player exceeds the shot clock limit. Ruling?","Standard foul",["Loss of rack","Warning","Time out"],"§3.14: exceeding the limit is a standard foul."],
["Fouls","§3.15","A ball touches the rack template after it has been removed from the playing surface. Ruling?","Foul",["No foul","Replay","Restore the ball only"],"§3.15: if the cue-ball or an object ball touches a rack template that has been removed from the playing surface, it is a foul."],
["Fouls","§3.15","After removing the template, where should the referee put it?","Away from the table, not on the rails",["On the head rail","Under the table","On the foot rail"],"§3.15 watch-for: put the template away from the table and do not leave it on the rails."],
["Unsportsmanlike","§3.16","Which of these is listed as Unsportsmanlike Conduct?","Practising during a match",["An unintentional miscue","Asking about cue-ball placement","Requesting a time out"],"§3.16 lists: distracting the opponent, moving balls other than by a shot, intentional miscue, playing on after a foul call, practising during a match, marking the table, delaying the game and misusing equipment."],
["Unsportsmanlike","§3.16","Which is NOT a penalty available for Unsportsmanlike Conduct?","Awarding the player a time out",["Warning","Standard-foul penalty","Ejection from competition"],"§3.16 penalties: warning; standard-foul penalty (counts toward three fouls); serious-foul penalty (loss of rack, set or match); ejection."],
["Unsportsmanlike","§3.16","A standard-foul penalty for Unsportsmanlike Conduct: does it count towards the three-foul rule?","Yes",["No","Only in 8-Ball","Only if intentional"],"§3.16(b): standard-foul penalty, which counts toward three fouls."],
["Unsportsmanlike","§3.16","What can a serious-foul penalty for Unsportsmanlike Conduct include?","Loss of rack, set or match",["Only loss of rack","Ball in hand only","A 5-minute suspension"],"§3.16(c): serious-foul penalty means loss of rack, set or match."],
["Unsportsmanlike","§3.16","A player keeps playing after the referee has called a foul. What is it?","Unsportsmanlike Conduct",["A standard foul","Legal play","A stalemate"],"§3.16(d): playing on after a foul call or suspension is unsportsmanlike conduct."],
// ---- 8-Ball
["8-Ball","§4","How many object balls are used in 8-Ball?","Fifteen",["Nine","Ten","Seven"],"§4: 8-Ball is played with fifteen numbered balls; each group has seven, plus the 8-ball."],
["8-Ball","§4.2","Where is the apex ball placed in an 8-Ball rack?","On the Foot Spot",["Above the Foot Spot","On the Centre Spot","On the Head Spot"],"§4.2: fifteen balls racked as tightly as possible with the apex ball on the Foot Spot."],
["8-Ball","§4.2","What goes on the two lower corners of an 8-Ball rack?","One ball from each group",["Two stripes","Two solids","The 1-ball and the 15-ball"],"§4.2: the 8-ball sits directly below the apex ball, with one ball from each group on the two lower corners."],
["8-Ball","§4.2","Where does the 8-ball sit in the rack?","Directly below the apex ball, in the middle",["At the apex","On a back corner","Anywhere"],"§4.2: the 8-ball sits directly below the apex ball."],
["8-Ball","§4.2","Is a 'J' or reverse 'J' pattern required in an 8-Ball rack?","No",["Yes","Only in tournaments","Only if the opponent asks"],"§4.2: a J or reverse J pattern is not a requirement. Other balls are placed randomly without intentional pattern."],
["8-Ball","§4.3","8-Ball break: no ball is pocketed and only 3 object balls reach a rail. What is it?","An illegal break",["A foul with ball in hand","A legal break","Loss of rack"],"§4.3: an illegal break is no object ball pocketed AND fewer than 4 object balls driven to a rail."],
["8-Ball","§4.3","After an illegal 8-Ball break, which is one of the incoming player's options?","Re-rack and allow the offending player to break again",["Ball in hand anywhere","Spot the 8-ball and push out","Claim the rack"],"§4.3: options are accept the table in position, re-rack and break, or re-rack and let the offending player break again."],
["8-Ball","§4.3","8-Ball break: 1 object ball pocketed and 2 others reach a rail. Ruling?","The breaker continues at the table",["Illegal break","Foul","The breaker must re-break"],"§4.3: pocketing a ball without fouling means the breaker continues; the table remains open."],
["8-Ball","§4.3","The breaker legally pockets the 8-ball on the break with no foul. What happens?","Not a win; the breaker may re-spot the 8 and continue, or re-break",["The breaker wins the rack","Loss of rack","The opponent gets ball in hand"],"§4.3: the 8-ball pocketed on a legal break is not a foul and not a win. Breaker options: re-spot the 8 and accept the table, or re-break."],
["8-Ball","§4.3","The breaker pockets the 8-ball and scratches on the break. What are the incoming player's options?","Re-spot the 8 and take cue-ball in hand above the Head String, or re-break",["Claim the rack win","Ball in hand anywhere","Accept the table with the 8 off"],"§4.3: foul on the break with the 8 pocketed: re-spot the 8 and take ball in hand above the Head String, or re-break."],
["8-Ball","§4.3","An object ball other than the 8 is driven off the table on the 8-Ball break. What happens to it?","Foul; it stays out of play",["It is spotted","It is returned to its original position","The rack is replayed"],"§4.3: an object ball driven off the table is a foul and remains out of play, except the 8-ball which is re-spotted."],
["8-Ball","§4.3","For a standard foul on the 8-Ball break, what are the incoming player's options?","Accept the table in position, or cue-ball in hand above the Head String",["Ball in hand anywhere","Re-rack only","Push out"],"§4.3: for fouls on the break the opponent may accept the table in position or take ball in hand above the Head String."],
["8-Ball","§4.3","Must the breaker call a shot on the 8-Ball break?","No",["Yes, ball and pocket","Yes, only the pocket","Only if he wants to claim a group"],"§4.3: cue-ball in hand above the Head String; no call needed on the break."],
["8-Ball","§4.4","On an open table, which ball may NOT be struck first?","The 8-ball",["Any stripe","Any solid","The 1-ball"],"§4.4: on an open table any ball may be struck first except the 8-ball. Hitting the 8 first is a foul."],
["8-Ball","§4.4","How does a player claim a group on an open table?","By legally pocketing his intended ball",["By hitting a ball of that group first","By calling the group before the break","By pocketing any ball on the break"],"§4.4: the shooter claims a group if he legally pockets his intended ball; the opponent is assigned the other group."],
["8-Ball","§4.4","The table is still open but a whole group is already pocketed. What may the shooter do?","Temporarily claim that group and shoot the 8 for the win",["Nothing; he must wait for groups","Ask for a re-rack","Shoot any ball"],"§4.4 exception: if a whole group is already pocketed while the table is open, the shooter may temporarily claim it and shoot the 8-ball for the win."],
["8-Ball","§4.6","A player calls 'safety' and pockets a ball of his group. What happens?","The ball stays pocketed and play passes to the opponent",["The ball is spotted and he continues","He continues at the table","Foul"],"§4.6: on a safety, play passes at the end of the shot; any ball pocketed on a safety stays pocketed."],
["8-Ball","§4.8","Which of these loses the rack in 8-Ball?","Pocketing the 8-ball in an uncalled pocket",["Pocketing the 8 on a legal break","Three consecutive fouls","Pocketing an opponent's ball"],"§4.8: the shooter loses if he pockets the 8 and fouls on the same shot, pockets it before clearing his group, pockets it in an uncalled pocket, or drives it off the table."],
["8-Ball","§4.8","A player pockets the 8-ball before clearing his group. Ruling?","He loses the rack",["The 8 is spotted and he continues","Foul only","Ball in hand to opponent"],"§4.8(b): pocketing the 8 before the group is cleared loses the rack (except on the break)."],
["8-Ball","§4.8","On his final shot a player pockets the 8 in the called pocket but scratches. Ruling?","He loses the rack",["He wins the rack","The 8 is spotted; ball in hand to opponent","Replay"],"§4.8(a): pocketing the 8-ball and fouling on the same shot loses the rack."],
["8-Ball","§4.8","Do the loss-of-rack conditions in §4.8 apply to the break shot?","No, the break is governed by §4.3",["Yes","Only the scratch rule","Only driving the 8 off the table"],"§4.8: these do not apply to the break shot (§4.3)."],
["8-Ball","§4.9","An 8-Ball player commits three consecutive fouls. Ruling?","Ball in hand only; 8-Ball has no three-foul rule",["Loss of rack","Loss of match","Warning then loss of rack"],"§4.9: 8-Ball does not use §3.13; three consecutive fouls is NOT a loss of rack."],
["8-Ball","§4.9","After groups are set, what must the cue-ball hit first in 8-Ball?","A ball of the shooter's group",["The lowest-numbered ball","Any ball","The 8-ball"],"§4.9 / §3.2: the first ball contacted must belong to the shooter's group, except when the table is open."],
// ---- 9-Ball
["9-Ball","§5","In 9-Ball, what order are object balls played in?","Ascending numerical order (lowest first)",["Any order","Descending order","Solids then stripes"],"§5: object balls are played in ascending order; legally pocketing the 9 wins."],
["9-Ball","§5","Are shots called in 9-Ball?","No",["Yes, ball and pocket","Only the 9-ball","Only after a push out"],"§5: shots do not need to be called in 9-Ball."],
["9-Ball","§5.2","How is a 9-Ball rack set up?","Diamond; 1 at the apex, 9 in the middle on the Foot Spot",["Triangle; 1 on the Foot Spot","Diamond; 9 at the apex","Diamond; 1 on the Foot Spot, 9 at the back"],"§5.2: diamond rack, 1-ball at the apex toward the head of the table, 9-ball in the middle on the Foot Spot; the rest random."],
["9-Ball","§5.2","Which ball sits on the Foot Spot in 9-Ball?","The 9-ball",["The 1-ball","The 2-ball","None"],"§5.2: the 9-ball is in the middle of the diamond, on the Foot Spot."],
["9-Ball","§5.3","9-Ball break: no ball pocketed and only 3 object balls reach a rail. Ruling?","Foul; ball in hand to the incoming player",["Illegal break with re-rack options","Legal break","Re-break by the same player"],"§5.3: if no ball is pocketed, four object balls must be driven to a rail, or it is a foul."],
["9-Ball","§5.3","Under the Three-Ball Break Rule, what must happen if no ball is pocketed?","Three balls must cross the Head String",["Four balls must reach a rail","The 1-ball must reach the head rail","Two balls must cross the Long String"],"§5.3 / Regulation 16: if no ball is pocketed, three balls must cross the Head String, or it is an illegal break."],
["9-Ball","§Reg 16","Three-Ball Break Rule: what counts toward the three balls?","Balls pocketed or crossing the Head String, in any combination",["Only balls crossing the Head String","Only pocketed balls","Balls reaching any rail"],"Regulation 16: at least three object balls must be pocketed or cross the Head String line."],
["9-Ball","§Reg 16","When does a ball count as having crossed the Head String?","When its centre passes the line",["When any part touches the line","When it reaches the head rail","When it stops above the Foot String"],"Regulation 16: the ball's centre must pass the line to count."],
["9-Ball","§Reg 16","The Three-Ball Break Rule is not met. What are the incoming player's options?","Accept the table as it is, or hand it back to the breaker",["Ball in hand anywhere","Re-rack and break","Claim the rack"],"Regulation 16: the incoming player may accept the table as it is or hand it back to the breaker."],
["9-Ball","§Reg 16","After a failed Three-Ball Break, the incoming player accepts the table. May he push out?","No",["Yes","Only if the 1 is hidden","Only once"],"Regulation 16: if the incoming player accepts the table, he is not allowed to push out."],
["9-Ball","§Reg 16","After a failed Three-Ball Break, the table is handed back to the breaker. May the breaker push out?","Yes",["No","Only with the referee's approval","Only if the 9 is still on the table"],"Regulation 16: if handed back, the breaker is allowed to push out."],
["9-Ball","§Reg 16","The breaker fails the Three-Ball Break requirement but the 9 is pocketed. What happens to the 9?","It is spotted",["The breaker wins","It stays down","The rack is replayed"],"Regulation 16: if the breaker fails the requirement and the 9 is pocketed, the 9 is spotted."],
["9-Ball","§5.4","When is a push out available in 9-Ball?","Only on the second shot of the rack, if there was no foul on the break",["On any shot","Only on the break","After any foul"],"§5.4: the push out is available only on the second shot of the rack, if there is no foul on the break."],
["9-Ball","§5.4","What must a shooter do before a push out?","Announce it to the referee, who echoes it back",["Nothing","Tap the table","Tell the opponent only"],"§5.4: the shooter must announce it to the referee first; the referee should echo it back."],
["9-Ball","§5.4","Which rules are suspended on a push out?","Wrong ball first (§3.2) and no rail after contact (§3.3)",["All foul rules","Only the scratch rule","Only the three-foul rule"],"§5.4: §3.2 and §3.3 are suspended for that one shot. All other fouls still apply."],
["9-Ball","§5.4","A player scratches the cue-ball on a push out. Ruling?","Foul; other fouls still apply on a push out",["No foul; it is a push out","Replay the push out","The opponent chooses who shoots"],"§5.4: only §3.2 and §3.3 are suspended; all other fouls, including a scratch, still apply."],
["9-Ball","§5.4","After a legal push out, who decides who shoots next?","The incoming player",["The player who pushed","The referee","The player who is behind"],"§5.4: after a push with no foul, the incoming player chooses who shoots next."],
["9-Ball","§5.4","The 9-ball is pocketed on a push out. What happens?","It is spotted",["The shooter wins","Loss of rack","It stays down"],"§5.4 / §5.6(b): if the 9 is pocketed on a push out, it is spotted."],
["9-Ball","§5.5","In 9-Ball, the 3 is the lowest ball. The player hits the 3 first and the cue-ball cannons the 9 into a pocket. Ruling?","The player wins the rack",["The 9 is spotted","Foul","The player continues"],"§5.5: legally pocketing the 9-ball on any shot (except a push out) wins the rack. Called shots are not required."],
["9-Ball","§5.5","After a standard foul in 9-Ball, where does the incoming player take the cue-ball?","Ball in hand anywhere on the table",["Above the Head String","Where it lies","On the Head Spot"],"§5.5: standard fouls give ball in hand anywhere on the table."],
["9-Ball","§5.6","Which object balls are spotted in 9-Ball?","Only the 9-ball",["All balls pocketed on a foul","The 1 and the 9","None"],"§5.6: only the 9 is spotted: when pocketed on a foul, pocketed on a push out, or driven off the table."],

["Equipment","§1.1","Which spots lie on the centre longitudinal line of the table?","Brown, Blue, Pink and Black",["Yellow, Brown and Green","All six spots","Blue and Pink only"],"§1.1 watch-for: Brown, Blue, Pink and Black all lie on the centre longitudinal line."],

["Equipment","§1.2","What is the snooker ball diameter?","52.5 mm (± 0.05 mm)",["57.2 mm","50.8 mm","52.5 mm (± 0.5 mm)"],"§1.2: 52.5 mm diameter, tolerance ± 0.05 mm."],

["Equipment","§1.2","Who may change a ball or set of balls?","The players by agreement, or the referee by decision",["Only the referee","Only the striker","Only the tournament director"],"§1.2: by agreement between players, or on a decision of the referee."],
["Equipment","§1.3","What is the minimum cue length?","3 ft (914 mm)",["2 ft 10 in (864 mm)","4 ft","3 ft 6 in"],"§1.3: the cue must be at least 3 ft (914 mm) in length."],
["Equipment","§1.4","A player wants to use a new cue extension device. What is required?","Prior approval from the relevant governing body",["Nothing","The referee's approval on the day","The opponent's consent"],"§1.4: all extensions, adaptors and devices to aid cueing or sighting must have prior approval from the relevant governing body."],

// Definitions
["Definitions","§2.1","Black is the only object ball left; aggregate scores are not relevant and the striker leads by more than seven. What may the striker do?","Claim the frame",["Nothing; he must pot the Black","Request a re-spotted Black","Concede"],"§2.1(b): a frame ends on a claim by the striker when Black is the only object ball left, aggregates are not relevant and he leads by more than seven."],
["Definitions","§2.1","Black is the only object ball left. What ends the frame?","The first pot or foul (unless scores are then equal)",["Only a pot","Only a foul","Three strokes each"],"§2.1(d) / §3.4: when Black is the only object ball left, the first pot or foul ends the frame."],
["Definitions","§2.2","What is a 'game' in snooker?","An agreed or stipulated number of frames",["One frame","A number of matches","A timed session"],"§2.2: a game is an agreed or stipulated number of frames."],
["Definitions","§2.4","Which balls are the object balls in snooker?","The 15 Reds and the 6 colours",["Only the Reds","Only the colours","All 22 balls"],"§2.4: the White is the cue-ball; the 15 Reds and 6 colours are the object balls."],
["Definitions","§2.5","Which of these ends a striker's turn?","The opponent asks him to play again after a foul",["He pots a Red","He pots a colour after a Red","He asks for a ball to be cleaned"],"§2.5: the turn continues until a stroke scores nothing, a foul is committed, the opponent is requested to play again after a foul, or the frame is claimed or the final Black potted."],
["Definitions","§2.6","What is feathering?","Addressing the cue-ball with the tip without making a stroke",["A stroke with heavy side","A push stroke","A jump shot"],"§2.6: a stroke is made when the striker strikes the cue-ball with the tip, except while addressing the cue-ball, known as feathering."],
["Definitions","§2.6","Which is NOT required for a stroke to be completed?","The striker has returned to his chair",["All balls have come to rest","Any required spotting is completed","Ancillary equipment removed or referee satisfied"],"§2.6(d): a stroke is not completed until all balls are at rest, spotting is done and equipment removed (or the referee is satisfied)."],
["Definitions","§2.7","A ball enters a pocket in a foul stroke. What is this called?","Pocketing",["Potting","A free ball","A miss"],"§2.7: causing a ball to enter a pocket in a foul stroke is pocketing, not potting."],
["Definitions","§2.8","What is a break in snooker?","A number of pots in successive strokes in one turn",["The opening stroke of a frame","A foul","The gap between frames"],"§2.8: a break is a number of pots in successive strokes made in any one turn by the striker."],
["Definitions","§2.9","When is the cue-ball in-hand?","Before each frame, when pocketed, when forced off, or when Black is re-spotted",["Whenever it is in Baulk","After any foul","After a free ball"],"§2.9: before the start of each frame, when pocketed, when forced off the table, or when the Black is re-spotted under §3.4(b)."],
["Definitions","§2.10","When does a colour become in play again?","When it is re-spotted",["Never","At the next frame","After the next Red is potted"],"§2.10: colours become in play again when re-spotted."],
["Definitions","§2.11","What is the 'ball on'?","Any ball that may legally be hit by the first impact of the cue-ball, or that may be potted",["The ball nearest the cue-ball","The highest-value ball","The ball the opponent nominates"],"§2.11: any ball which may be legally hit by the first impact, or which may not be so hit but may be potted."],
["Definitions","§2.12","The referee asks the striker which ball he is on and he fails to declare. Penalty?","Seven points",["Four points","Value of the ball on","No penalty"],"§2.12(b) / §3.11(d)(v): failing to declare which ball he is on when requested is a seven-point foul."],
["Definitions","§2.12","How may a striker nominate a ball?","By indicating it to the referee's satisfaction, or declaring it verbally",["Only by pointing","Only in writing","By touching it with the cue"],"§2.12: the nominated ball is the one the striker indicates to the satisfaction of the referee, or declares (states verbally)."],
["Definitions","§2.13","What is a free ball?","A ball other than the ball on, nominated as the ball on when snookered after a foul",["Any ball after a miss","A Red re-spotted in error","The ball after a re-rack"],"§2.13: a free ball is a ball, other than the ball on, which the striker nominates as the ball on when snookered after a foul."],
["Definitions","§2.15","What is the difference between a foul and a penalty?","A foul ends the offender's turn; a penalty does not affect the order of play",["They are the same","A penalty ends the turn; a foul does not","A foul is always seven points"],"§2.15: a foul is an infringement which ends the offender's turn; a penalty is an infringement which does not affect the order of play."],
["Definitions","§2.16","Who receives penalty points?","The non-offender",["The offender","The referee decides","Nobody"],"§2.16: penalty points are awarded to the non-offender after any infringement."],
["Definitions","§2.17","When is the cue-ball snookered?","When a straight-line direct stroke to every ball on is wholly or partly obstructed by balls not on",["When any ball blocks one ball on","When the cue-ball is touching a cushion","When the opponent says so"],"§2.17: snookered when a direct stroke in a straight line to every ball on is wholly or partially obstructed by a ball or balls not on."],
["Definitions","§2.17","One ball on can be hit at both extreme edges with no obstruction. Is the cue-ball snookered?","No",["Yes","Partially","Only if in-hand"],"§2.17: if one or more balls on can be hit at both extreme edges free of obstruction by any ball not on, the cue-ball is not snookered."],
["Definitions","§2.17","When is a cue-ball in-hand snookered?","Only if obstructed from all possible positions on or within the D",["From any one position in the D","Never","Always after a foul"],"§2.17(a): in-hand, the cue-ball is snookered only if obstructed from all possible positions on or within the lines of the D."],
["Definitions","§2.17","The cue-ball is obstructed by more than one ball not on. Which is the effective snookering ball?","The ball nearest the cue-ball",["The ball nearest the ball on","The highest-value ball","All of them always"],"§2.17(b): the ball nearest the cue-ball is the effective snookering ball; equidistant balls are all effective."],
["Definitions","§2.17","Red is on and different Reds are blocked by different balls not on. What is the effective snookering ball?","There is none",["The nearest ball","The highest-value ball","The Black"],"§2.17(c): if obstructed from different Reds by different balls not on, there is no effective snookering ball."],
["Definitions","§2.17","Can the cue-ball be snookered by a cushion?","No",["Yes","Only by a corner cushion","Only when in-hand"],"§2.17(d,e): the cue-ball cannot be snookered by a cushion."],
["Definitions","§2.18","When is a spot occupied?","When a ball cannot be placed on it without touching another ball",["When any ball is within a ball's width","When the referee decides","When a ball covers part of it"],"§2.18: a spot is occupied if a ball cannot be placed on it without touching another ball."],
["Definitions","§2.19","What is a push stroke?","The tip stays in contact after the cue-ball starts moving (beyond momentary), or as it hits an object ball",["Any slow stroke","Any stroke with an elevated cue","A stroke that misses"],"§2.19: tip remains in contact after the cue-ball has commenced motion, other than momentarily at initial contact, or as it contacts an object ball."],
["Definitions","§2.19","Cue-ball and object ball are almost touching; the cue-ball hits a very fine edge. Is it a push stroke?","No",["Yes","Only if the object ball moves","Only if the tip follows through"],"§2.19 exception: not a push stroke if the cue-ball hits a very fine edge of an almost-touching object ball."],
["Definitions","§2.20","What is a jump shot?","The cue-ball passes over any part of an object ball, whether hitting it or not",["Any stroke with the cue raised","A cue-ball leaving the table","Hitting a ball on the bounce"],"§2.20: a jump shot is when the cue-ball passes over any part of an object ball."],
["Definitions","§2.20","The cue-ball first hits one object ball (not a touching ball), then jumps over another. Is it a jump shot?","No",["Yes","Only if it lands beyond","Yes, a 4-point foul"],"§2.20(a): not a jump shot if the cue-ball first hits one object ball, other than a touching ball, then jumps over another."],
["Definitions","§2.21","When a free ball has been nominated, when is it a miss?","If the cue-ball fails to first hit the free ball or it simultaneously with a ball on",["Only if it misses all balls","Never","Only if a Red is hit first"],"§2.21: a miss is when the cue-ball fails to first hit the nominated free ball or that ball simultaneously with a ball on."],
["Definitions","§2.22","When does a consultation period start?","From the moment the decision is made to replace the balls",["When the players start talking","After the next stroke","When the referee calls foul"],"§2.22: it starts from the moment the decision is made to replace the ball(s) and ends when both players are satisfied or by the referee's final decision."],
["Definitions","§2.22","During a consultation period, the non-striker touches a ball on the table. Penalty?","Seven points",["Four points","No penalty","Value of the ball touched"],"§2.22 watch-for / §3.11(f): touching any ball during a consultation period costs seven points, and it applies to either player."],
// The Game
["The Game","§3.1","How are Reds and colours played while Reds remain?","Reds and colours potted alternately",["All Reds first, then colours","Any order","Colours first"],"§3.1: scoring is made by potting Reds and colours alternately until all Reds are off the table."],
["The Game","§3.1","After all Reds are gone, in what order are the colours potted?","Ascending order of value",["Descending order","Any order","Striker's choice"],"§3.1: colours are then potted in ascending order of their value."],
["The Game","§3.1","What is the snooker tactic?","Leaving the cue-ball behind a ball not on so the next player is snookered",["Potting the Black after every Red","Breaking off softly","Asking for a re-rack"],"§3.1(e): leaving the cue-ball behind a ball not on, so that it is snookered for the next player."],
["Position of Balls","§3.2","Where is the apex Red placed at the start?","On the centre line above the Pink Spot, as close as possible without occupying it",["On the Pink Spot","On the Black Spot","Touching the Pink"],"§3.2(a): the apex Red is on the centre longitudinal line above the Pink Spot and as close to it as possible without occupying it."],
["Position of Balls","§3.2","How must the base of the Red triangle be placed?","Parallel with the Top Cushion",["Parallel with the side cushions","Against the Black","Angled towards the Top Cushion"],"§3.2(a): the base of the triangle is parallel with the Top Cushion."],
["Position of Balls","§3.2","After a frame has started, who may clean a ball?","Only the referee, on reasonable request by the striker",["The striker","Either player","The marker without request"],"§3.2(c): a ball in play may only be cleaned by the referee on reasonable request by the striker; its position is marked first."],
["Position of Balls","§3.2","While a ball is being cleaned, the striker touches the marking device. Ruling?","Infringement; penalty points to the non-offender and a consultation period",["No penalty","Warning","Re-rack"],"§3.2(c)(ii): the device acquires the value of the ball. Contacting it is an infringement; award penalty points, replace the device or ball, and a consultation period starts."],
["Position of Balls","§3.2","What value does the marking device acquire while a ball is cleaned?","The value of the ball it marks",["Four points","Seven points","No value"],"§3.2(c)(ii): the device shall be regarded as, and acquire the value of, the ball until it is replaced."],
// Mode of play
["Mode of Play","§3.3","May the order of play change during a frame?","Only when a player is asked by the next player to play again after a foul",["Yes, by agreement","Never","Only at the referee's discretion"],"§3.3(a): the order must remain unaltered, except that a player may be asked by the next player to play again after any foul."],

["Mode of Play","§3.3","When does the frame start?","When the cue-ball is placed on the playing area and contacted by the tip",["When the referee racks","When the first Red is potted","When the players shake hands"],"§3.3(c): when the cue-ball has been placed on the playing area and contacted by the tip, either as a stroke is made or while addressing it."],
["Mode of Play","§3.3","The wrong player breaks off; only one stroke played, no infringement since. What happens?","Re-start correctly without penalty",["Play continues","Foul on the wrong player","Frame awarded"],"§3.3(d): re-start correctly without penalty if only one stroke has been played and no infringement committed since."],
["Mode of Play","§3.3","Whose responsibility is it to remove rests and equipment from the table?","The striker's",["The referee's","The opponent's","The marker's"],"§3.3(f): it is the striker's responsibility to ensure all objects or ancillary equipment from this or previous turns are removed."],
["Mode of Play","§3.3","The striker pots a Red. What is the next ball on?","A colour of the striker's choice",["Another Red","The Black","The lowest colour"],"§3.3(h)(i): after a Red is potted, the next ball on is a colour of the striker's choice."],
["Mode of Play","§3.3","The striker pots two Reds in one stroke. What does he score?","2 points",["1 point","Foul","1 point and a foul"],"§3.3(g): the value of each Red potted in the same stroke is scored."],
["Mode of Play","§3.3","In a break, the striker plays before the referee has finished spotting a colour, with all other balls at rest. What happens?","The colour's value is not scored and a foul applies",["The colour counts","No penalty","Replay"],"§3.3(h)(iv): the value of the colour shall not be scored and §3.11(a)(i) or (b)(ii) applies."],
["Mode of Play","§3.3","A player pots a Red on a foul. Is the Red replaced?","No, Reds are not usually replaced",["Yes, on the Pink Spot","Yes, on its original position","Only if the opponent asks"],"§3.3(i): Reds are not usually replaced once potted, pocketed or forced off the table, even if a player benefits from a foul."],
["Mode of Play","§3.3","The non-striker comes to the table out of turn and moves a ball. What does the referee call?","PENALTY",["FOUL","MISS","FREE BALL"],"§3.3(k): it is a penalty. Call PENALTY, replace the ball(s), and the striker's turn continues unaffected."],
["Mode of Play","§3.3","After a non-striker's penalty out of turn, what happens to the striker's turn?","It continues unaffected",["It ends","He loses the frame","He must play from in-hand"],"§3.3(k): the striker's turn continues unaffected; a consultation period starts when the balls are to be replaced."],
["Mode of Play","§3.3","After the opponent's final stroke, the incoming player strikes before the balls stop. Ruling?","Penalised as striker; his turn ends",["No penalty since it was not his turn yet","Penalty only; he continues","Replay"],"§3.3(l): striking before the balls have come to rest or before spotting is completed is penalised as if he were the striker, and his turn ends."],

["In-hand","§3.5","The striker accidentally touches the cue-ball with his tip while positioning it in the D, not attempting a stroke. Ruling?","The cue-ball is not in play; no foul",["Foul","Four-point penalty","Stroke played"],"§3.5(c): if the referee is satisfied the striker was not attempting a stroke, the cue-ball is not in play."],

// Spotting colours

["Spotting","§3.7","A colour potted in ascending order is spotted in error. What happens when discovered?","It is removed without penalty and play continues",["Foul on the striker","Re-rack","Its points are deducted"],"§3.7(b): it is removed from the table without penalty when discovered, and play continues from the resulting position."],

["Spotting","§3.7","Two colours need spotting and their spots are contested. Which takes precedence?","The higher value ball",["The lower value ball","The one potted first","The striker's choice"],"§3.7: if more than one colour is to be spotted, the highest value ball takes precedence."],

["Touching Ball","§3.8","A Red is potted and the cue-ball is left touching a colour. What does the referee ask?","For the striker to DECLARE which colour he is on",["Nothing","Which Red he is on","Whether he wants a free ball"],"§3.8(a): if touching colours after a Red has been potted, ask the striker to DECLARE which colour he is on."],

["Touching Ball","§3.8","The cue-ball touches a ball on and a ball not on. Which does the referee indicate?","Only the ball on",["Both","Only the ball not on","Neither"],"§3.8(d)–(e): indicate only the ball on as touching. If asked whether it is also touching the ball not on, the striker is entitled to be told."],

["Ball on Edge","§3.9","A ball balances on the pocket edge momentarily then falls in. Ruling?","Potted or pocketed; not replaced",["Replaced","Foul","Replay the stroke"],"§3.9(c): a ball that balances momentarily then falls in is considered potted or pocketed and not replaced."],

// Fouls

["Fouls","§3.10","A foul is neither awarded nor claimed before the next stroke. Status?","Condoned",["Still penalised","Replay","Warning"],"§3.10(c): it is condoned."],

["Fouls","§3.10","The striker fouls a ball before striking the cue-ball. What may the non-offender do?","Play from the position left, or have the offender play again from the position left or the original position",["Only play himself","Only take a free ball","Re-rack"],"§3.10(i): the non-offender may play himself from the position left, or ask the offender to play again from the position left or the original position."],

["Penalty Values","§3.11","What is the minimum penalty for a foul?","Four points",["One point","Seven points","Two points"],"§3.11: penalties are the value of the ball on or the ball concerned, with a minimum of four."],
