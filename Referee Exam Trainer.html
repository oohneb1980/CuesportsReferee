<script>
const SETS={
  pool:{name:"Pool",bank:window.BANK_POOL,std:"WPA Rules of Play · eff. 2025-09-15",meta:"8-Ball · 9-Ball · 10-Ball · Regulations"},
  billiards:{name:"English Billiards",bank:window.BANK_BILLIARDS,std:"WPBSA Rules",meta:"Equipment · Scoring · Baulk-line · Fouls"},
  snooker:{name:"Snooker",bank:window.BANK_SNOOKER,std:"WPBSA Rules",meta:"Fouls · Free Ball · Miss rule · Officials"}
};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={}; let timer=null;

function home(){
  clearInterval(timer);
  const best=store.get("refexam-best")||{};
  app.innerHTML=`
  <header>
    <div class="eyebrow">Cuesports Singapore · Referee Certification</div>
    <h1>“C” Grade Exam Trainer</h1>
    <p class="lede">Multiple-choice practice built from the course decks, focused on the points highlighted in red. Pick a discipline. After each answer you see the correct choice and the rule behind it.</p>
  </header>
  <div class="sets">${Object.entries(SETS).map(([k,s])=>`
    <button class="set" data-set="${k}">
      <span class="name">${s.name}</span>
      <span class="std">${s.std}</span>
      <span class="meta">${s.bank.length} questions · ${s.meta}</span>
      <span class="best">${best[k]!=null?`Best mock exam: ${best[k]}%`:""}</span>
    </button>`).join("")}
  </div>
  <p class="note">Theory assessment format: 30 questions in 30 minutes, 75% to pass. The mock exam mode follows that format.</p>`;
  app.querySelectorAll(".set").forEach(b=>b.onclick=()=>setup(b.dataset.set));
}

function setup(key){
  const set=SETS[key];
  const topics=[...new Set(set.bank.map(q=>q[0]))];
  let mode="mock";
  app.innerHTML=`
  <header>
    <button class="link" id="back">← All disciplines</button>
    <div class="eyebrow" style="margin-top:10px">${set.std}</div>
    <h1>${set.name}</h1>
  </header>
  <div class="panel">
    <h2>Choose a mode</h2>
    <div class="modes">
      <button class="mode" data-m="mock" aria-pressed="true"><b>Mock exam</b><span>30 random questions · 30-minute clock · 75% to pass</span></button>
      <button class="mode" data-m="all" aria-pressed="false"><b>Full question bank</b><span>All ${set.bank.length} questions, shuffled, no clock</span></button>
      <button class="mode" data-m="topic" aria-pressed="false"><b>By topic</b><span>Drill one section of the rules</span></button>
    </div>
    <label class="field" id="topicWrap" hidden>Topic
      <select id="topic">${topics.map(t=>`<option value="${esc(t)}">${esc(t)} (${set.bank.filter(q=>q[0]===t).length})</option>`).join("")}</select>
    </label>
    <div class="row"><button class="btn" id="go">Start</button></div>
  </div>`;
  $("#back").onclick=home;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.m;app.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#topicWrap").hidden=mode!=="topic"});
  $("#go").onclick=()=>{
    let qs=shuffle(set.bank);
    if(mode==="mock")qs=qs.slice(0,30);
    if(mode==="topic")qs=qs.filter(q=>q[0]===$("#topic").value);
    start(key,mode,qs);
  };
}

function start(key,mode,qs){
  S={key,mode,i:0,answers:[],qs:qs.map(q=>{const opts=shuffle([q[3],...q[4]]);return{topic:q[0],ref:q[1],text:q[2],opts,correct:opts.indexOf(q[3]),why:q[5]}}),deadline:mode==="mock"?Date.now()+30*60*1000:null};
  clearInterval(timer);
  if(S.deadline)timer=setInterval(tick,1000);
  render();
}
function tick(){const el=$("#clock");if(!el)return;const ms=S.deadline-Date.now();if(ms<=0){clearInterval(timer);results(true);return}const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`}

function render(){
  const q=S.qs[S.i],n=S.qs.length,ans=S.answers[S.i];
  const score=S.answers.filter(a=>a&&a.ok).length,done=S.answers.filter(Boolean).length;
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="link" id="quit">← Quit to menu</button><span class="note">${SETS[S.key].name} · ${S.mode==="mock"?"Mock exam":S.mode==="all"?"Full bank":esc(q.topic)}</span></div>
  <div class="board">
    <div><span class="k">Question</span><span class="v">${S.i+1}<small style="font-size:.55em;opacity:.6">/${n}</small></span></div>
    <div><span class="k">Correct</span><span class="v">${score}</span></div>
    <div><span class="k">Accuracy</span><span class="v">${done?Math.round(score/done*100):0}%</span></div>
    ${S.deadline?`<div><span class="k">Time left</span><span class="v" id="clock">30:00</span></div>`:""}
    <div class="grow"><span class="k">Progress</span><div class="bar" style="margin-top:8px;background:color-mix(in srgb,var(--bg) 25%,transparent)"><i style="width:${done/n*100}%"></i></div></div>
  </div>
  <article class="q">
    <div class="qhead"><span>${esc(q.topic)}</span><span class="chip">${esc(q.ref)}</span></div>
    <p class="qtext">${esc(q.text)}</p>
    <div class="opts">${q.opts.map((o,j)=>{
      let c="";if(ans){c=j===q.correct?"correct":j===ans.pick?"wrong":"dim"}
      return `<button class="opt ${c}" data-j="${j}" ${ans?"disabled":""}><span class="letter">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`}).join("")}
    </div>
    ${ans?`<div class="verdict ${ans.ok?"ok":"no"}">
      <strong>${ans.ok?"Correct":"Incorrect"}</strong>
      ${ans.ok?"":`<p class="ans">Correct answer: ${"ABCD"[q.correct]}. ${esc(q.opts[q.correct])}</p>`}
      <p>${esc(q.why)}</p>
    </div>
    <div class="row"><button class="btn" id="next">${S.i+1<n?"Next question →":"See results"}</button><span class="note">Press Enter for next</span></div>`:`<span class="note">Press A–D or 1–4 to answer</span>`}
  </article>`;
  if(S.deadline)tick();
  $("#quit").onclick=home;
  app.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  const nx=$("#next");if(nx){nx.onclick=next;nx.focus()}
}
function pick(j){const q=S.qs[S.i];S.answers[S.i]={pick:j,ok:j===q.correct};render()}
function next(){if(S.i+1<S.qs.length){S.i++;render();window.scrollTo({top:0})}else results(false)}
document.addEventListener("keydown",e=>{
  if(!S.qs||!$(".q"))return;
  const ans=S.answers[S.i];
  if(!ans){const k="abcd1234".indexOf(e.key.toLowerCase());if(k>-1&&k%4<S.qs[S.i].opts.length)pick(k%4)}
  else if(e.key==="Enter"){e.preventDefault();next()}
});

function results(timeUp){
  clearInterval(timer);
  const n=S.qs.length,score=S.answers.filter(a=>a&&a.ok).length,pct=Math.round(score/n*100),pass=pct>=75;
  if(S.mode==="mock"){const b=store.get("refexam-best")||{};if(b[S.key]==null||pct>b[S.key]){b[S.key]=pct;store.set("refexam-best",b)}}
  const byT={};S.qs.forEach((q,i)=>{byT[q.topic]=byT[q.topic]||[0,0];byT[q.topic][1]++;if(S.answers[i]&&S.answers[i].ok)byT[q.topic][0]++});
  const wrong=S.qs.map((q,i)=>({q,a:S.answers[i]})).filter(x=>!x.a||!x.a.ok);
  app.innerHTML=`
  <header>
    <div class="eyebrow">${SETS[S.key].name} · ${S.mode==="mock"?"Mock exam":"Practice"} ${timeUp?"· Time up":""}</div>
    <div class="row" style="align-items:flex-end;gap:18px;margin-top:6px">
      <span class="big ${pass?"pass":"fail"}">${pct}%</span>
      <div><h2>${pass?"Pass standard met":"Below pass standard"}</h2><p class="lede" style="margin:4px 0 0">${score} of ${n} correct. The theory assessment needs 75%.</p></div>
    </div>
  </header>
  <div class="row"><button class="btn" id="again">Try again</button>${wrong.length?`<button class="btn ghost" id="redo">Retry the ${wrong.length} missed</button>`:""}<button class="btn ghost" id="menu">All disciplines</button></div>
  <section class="panel"><h2>By topic</h2><div class="topics">${Object.entries(byT).map(([t,[c,tot]])=>{const p=c/tot*100;return`<div class="trow"><span>${esc(t)}</span><div class="bar"><i class="${p<75?"lo":""}" style="width:${p}%"></i></div><span class="n">${c}/${tot}</span></div>`}).join("")}</div></section>
  ${wrong.length?`<section class="panel"><h2>Review missed questions</h2><div class="review">${wrong.map(({q,a})=>`
    <div class="rv"><div class="qhead"><span>${esc(q.topic)}</span><span class="chip">${esc(q.ref)}</span></div>
      <b>${esc(q.text)}</b>
      <span class="yours">Your answer: ${a?esc(q.opts[a.pick]):"Not answered"}</span>
      <span class="right">Correct: ${esc(q.opts[q.correct])}</span>
      <span class="why">${esc(q.why)}</span></div>`).join("")}</div></section>`:""}`;
  window.scrollTo({top:0});
  $("#menu").onclick=home;
  $("#again").onclick=()=>setup(S.key);
  const r=$("#redo");if(r)r.onclick=()=>{const bank=SETS[S.key].bank;const missed=wrong.map(w=>bank.find(b=>b[2]===w.q.text));start(S.key,"retry",missed)};
}
home();
</script>

</body></html>
